name: heli_tool
description: "Professional Helicopter Navigation Tool"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.4.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  flutter_map: ^6.1.0        # Harita altyapısı
  latlong2: ^0.9.0           # Koordinat hesaplamaları
  geolocator: ^12.0.0        # GPS konumu için
  http: ^1.2.1               # NOTAM ve İrtifa verisi çekmek için
  shared_preferences: ^2.2.2 # Waypoint/Favori kaydetmek için
  intl: ^0.19.0              # Tarih ve saat formatı için

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true